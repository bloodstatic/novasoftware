<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="darkBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141416" />
      <stop offset="100%" stop-color="#040405" />
    </radialGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#999999" />
    </linearGradient>
  </defs>

  <!-- Monochrome background -->
  <circle cx="100" cy="100" r="100" fill="url(#darkBg)" />

  <!-- Subtle ring -->
  <circle cx="100" cy="100" r="92" fill="none" stroke="rgba(255, 255, 255, 0.15)" stroke-width="2" />

  <!-- Minimalist white lightning bolt -->
  <path d="M108 34 L66 104 L98 104 L86 166 L144 92 L112 92 Z" 
        fill="url(#silverGrad)" 
        stroke="#ffffff" 
        stroke-width="1.5" 
        stroke-linejoin="round"/>
</svg>
