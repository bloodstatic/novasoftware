<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>dontdestroymeagain</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- Modern bold fonts: Bebas Neue, Kanit & Montserrat -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Kanit:wght@500;600;700&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<body oncontextmenu="return false;" ondragstart="return false;" onselectstart="return false;">

  <!-- Click to enter -->
  <div id="enter-overlay" class="enter-overlay">
    <div class="enter-content">
      <div class="enter-icon"><i class="fa-solid fa-play"></i></div>
      <p class="enter-prompt">click to enter</p>
    </div>
  </div>

  <!-- Pure Black & White 1080p Video Background -->
  <div class="video-container" id="video-container">
    <video id="bg-video" autoplay loop muted playsinline>
      <source src="background.mp4" type="video/mp4">
    </video>
    <div class="dark-vignette"></div>
  </div>

  <!-- Pure B&W Scanlines & Glitch Overlays -->
  <div class="scanlines-overlay" aria-hidden="true"></div>
  <div class="glitch-overlay" aria-hidden="true"></div>

  <!-- Main Monochrome Bio Card -->
  <main class="page-wrapper">
    <div class="dark-card" id="bio-card">
      
      <!-- Custom Corner Brackets (Bespoke Dark Cyber/Noir Frame) -->
      <span class="corner-bracket corner-tl"></span>
      <span class="corner-bracket corner-tr"></span>
      <span class="corner-bracket corner-bl"></span>
      <span class="corner-bracket corner-br"></span>

      <!-- Profile Section -->
      <div class="profile-section">
        <div class="avatar-holder">
          <img id="discord-avatar" class="avatar-img" src="avatar.svg" alt="Avatar" onerror="this.src='avatar.svg'">
          <span class="status-dot online" id="status-dot"></span>
        </div>

        <div class="user-meta">
          <h1 class="username" id="display-name" data-text="dontdestroymeagain">dontdestroymeagain</h1>

          <!-- Discord handle to copy -->
          <button class="handle-pill" id="copy-handle-btn" title="Click to copy">
            <i class="fa-brands fa-discord"></i>
            <span id="discord-handle">dontdestroymeagain</span>
            <i class="fa-regular fa-copy copy-icon"></i>
          </button>

          <!-- Custom status -->
          <p class="bio-quote">
            <span class="quote-text" id="custom-status-text">"lost in the static"</span>
          </p>
        </div>
      </div>

      <!-- Atmospheric Divider -->
      <div class="card-divider">
        <span class="divider-line"></span>
        <span class="divider-tag">// LINKS //</span>
        <span class="divider-line"></span>
      </div>

      <!-- Actions Section: Stacked Dark Buttons -->
      <div class="actions-section">
        <!-- Monochrome Discord Join Button -->
        <a href="https://discord.gg/novasoftware" target="_blank" rel="noopener noreferrer" class="action-btn discord-btn" id="discord-join-link">
          <div class="btn-left">
            <div class="btn-icon">
              <i class="fa-brands fa-discord"></i>
            </div>
            <div class="btn-info">
              <span class="btn-title">JOIN SERVER</span>
              <span class="btn-url">discord.gg/novasoftware</span>
            </div>
          </div>
          <div class="btn-arrow">
            <i class="fa-solid fa-arrow-up-right-from-square"></i>
          </div>
        </a>

        <!-- YouTube Link (Clean Dark Monochrome) -->
        <a href="https://www.youtube.com/@e9tc" target="_blank" rel="noopener noreferrer" class="action-btn youtube-btn" id="youtube-link" title="YouTube">
          <div class="btn-left">
            <div class="btn-icon">
              <i class="fa-brands fa-youtube"></i>
            </div>
            <div class="btn-info">
              <span class="btn-title">YOUTUBE</span>
              <span class="yt-url" id="youtube-url-text">youtube.com/@e9tc</span>
            </div>
          </div>
          <div class="btn-arrow">
            <i class="fa-solid fa-arrow-up-right-from-square"></i>
          </div>
        </a>
      </div>

    </div>
  </main>

  <!-- Toast Notification -->
  <div id="toast" class="toast">
    <span class="toast-dot"></span>
    <span id="toast-text">Copied cvvfr to clipboard</span>
  </div>

  <script src="script.js"></script>
</body>
</html>
